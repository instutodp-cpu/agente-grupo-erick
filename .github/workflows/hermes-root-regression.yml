name: Hermes root regression suite

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/hermes-root-regression.yml'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hermes-root-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  root-test-suite:
    name: Root test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run root test suite
        run: npm test

version: "1.0"
mode: simulation_first
rules:
  single_use: true
  exact_scope_required: true
  exact_artifact_hash_required: true
  expiration_required: true
  consumed_approval_reuse: block
  rejected_approval: block
  expired_approval: block
  concurrent_consumption: exactly_one_winner
  external_execution: false
fail_closed:
  missing_expiration: block
  invalid_status: block
  scope_mismatch: block
  artifact_mismatch: block
  replay: block
